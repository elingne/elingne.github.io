<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character | elingne archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">elingne</a>
    <nav>
      <a href="index.html">MAIN</a>
      <a class="active" href="index.html#characters">CHARACTER</a>
      <a href="index.html#pairs">PAIR</a>
      <a id="auth-link" class="admin-link" href="admin.html">ADMIN</a>
    </nav>
  </header>

  <main class="character-page">
    <section id="character-head" class="character-head">
      <p class="muted">캐릭터를 불러오는 중...</p>
    </section>

    <div id="owner-character-tools" class="owner-tools hidden">
      <button id="edit-character-btn" class="ghost">캐릭터 기본정보 수정</button>
      <button id="delete-character-btn" class="ghost danger">캐릭터 삭제</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="profile">PROFILE</button>
      <button class="tab" data-tab="log">LOG</button>
      <button class="tab" data-tab="gallery">GALLERY</button>
    </div>

    <section id="profile" class="tab-panel active">
      <div class="panel-head">
        <h2>PROFILE</h2>
        <button class="owner-only hidden" data-open-editor="profile">+ 프로필 게시물</button>
      </div>
      <div id="profile-feed" class="feed"></div>
    </section>

    <section id="log" class="tab-panel">
      <div class="panel-head">
        <h2>LOG</h2>
        <button class="owner-only hidden" data-open-editor="log">+ 로그 게시물</button>
      </div>
      <div id="log-feed" class="feed"></div>
    </section>

    <section id="gallery" class="tab-panel">
      <div class="panel-head">
        <h2>GALLERY</h2>
        <button class="owner-only hidden" data-open-editor="gallery">+ 갤러리 게시물</button>
      </div>
      <div id="gallery-feed" class="feed"></div>
    </section>
  </main>

  <dialog id="editor-dialog" class="editor-dialog">
    <form method="dialog" class="editor-shell">
      <div class="editor-top">
        <h2 id="editor-title">게시물 편집</h2>
        <button value="cancel" class="ghost">닫기</button>
      </div>

      <input id="edit-kind" type="hidden">
      <input id="edit-id" type="hidden">

      <label id="title-wrap">제목
        <input id="edit-title" type="text" placeholder="선택사항">
      </label>

      <label>내용
        <textarea id="edit-body" rows="10" placeholder="텍스트 없이 사진만 올려도 됩니다."></textarea>
      </label>

      <label id="sort-wrap" class="hidden">프로필 표시 순서
        <input id="edit-sort" type="number" value="0">
      </label>

      <div class="multi-image-box">
        <div class="subhead">
          <strong>이미지</strong>
          <span class="muted">한 장씩 추가할 수 있습니다</span>
        </div>
        <input id="edit-image-picker" class="hidden-file-input" type="file" accept="image/*" multiple>
        <button id="add-image-btn" type="button" class="ghost">+ 이미지 추가</button>
        <div id="new-image-caption-list" class="image-edit-list"></div>
      </div>

      <div id="existing-images-wrap" class="multi-image-box hidden">
        <div class="subhead">
          <strong>현재 이미지</strong>
          <span class="muted">캡션 수정 또는 삭제 가능</span>
        </div>
        <div id="existing-image-list" class="image-edit-list"></div>
      </div>

      <div class="button-row">
        <button id="save-editor-btn" value="cancel" type="button">저장</button>
        <button id="delete-editor-btn" value="cancel" type="button" class="danger hidden">게시물 삭제</button>
      </div>
      <p id="editor-msg" class="status"></p>
    </form>
  </dialog>

  <dialog id="character-dialog" class="editor-dialog">
    <form method="dialog" class="editor-shell">
      <div class="editor-top">
        <h2>캐릭터 기본정보 수정</h2>
        <button value="cancel" class="ghost">닫기</button>
      </div>
      <label>이름
        <input id="char-name" type="text">
      </label>
      <label>한 줄 설명
        <input id="char-summary" type="text">
      </label>
      <label>대표 이미지 교체
        <input id="char-image" type="file" accept="image/*">
      </label>
      <button id="save-character-btn" value="cancel" type="button">저장</button>
      <p id="char-msg" class="status"></p>
    </form>
  </dialog>


  <dialog id="post-view-dialog" class="post-view-dialog">
    <div class="post-view-shell">
      <div class="post-view-top">
        <div>
          <p id="post-view-kind" class="eyebrow"></p>
          <h2 id="post-view-title"></h2>
        </div>
        <button id="close-post-view" class="ghost" type="button">닫기</button>
      </div>
      <p id="post-view-date" class="post-date"></p>
      <div id="post-view-body" class="post-body"></div>
      <div id="post-view-images" class="post-view-images"></div>
      <div id="post-view-owner-tools" class="post-view-owner-tools hidden">
        <button id="post-view-edit-btn" type="button">수정</button>
      </div>
    </div>
  </dialog>

  <footer>© elingne</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="character-v6.js"></script>
</body>
</html>
