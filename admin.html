<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | elingne archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">elingne</a>
    <nav>
      <a href="index.html">MAIN</a>
      <a href="index.html#characters">CHARACTER</a>
      <a href="index.html#pairs">PAIR</a>
      <a class="active" href="admin.html">ADMIN</a>
    </nav>
  </header>

  <main class="admin-wrap">
    <section id="login-box" class="admin-card">
      <p class="eyebrow">OWNER ONLY</p>
      <h1>ADMIN LOGIN</h1>
      <label>이메일
        <input id="email" type="email" autocomplete="email" />
      </label>
      <label>비밀번호
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button id="login-btn">로그인</button>
      <p id="login-msg" class="muted"></p>
    </section>

    <section id="logged-box" class="admin-card hidden">
      <p class="eyebrow">OWNER MODE</p>
      <h1>로그인됨</h1>
      <p>편집은 각 캐릭터 페이지에서 바로 할 수 있습니다.</p>
      <div class="button-row">
        <a class="button-link" href="index.html#characters">캐릭터 목록으로</a>
        <button id="logout-btn" class="ghost">로그아웃</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-v2.js"></script>
</body>
</html>
