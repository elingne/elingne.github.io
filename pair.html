<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pair | elingne archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">elingne</a>
    <nav>
      <a href="index.html">MAIN</a>
      <a href="index.html#characters">CHARACTER</a>
      <a class="active" href="index.html#pairs">PAIR</a>
      <a id="auth-link" class="admin-link" href="admin.html">ADMIN</a>
    </nav>
  </header>

  <main class="character-page">
    <section id="pair-head" class="pair-head">
      <div>
        <p class="eyebrow">PAIR</p>
        <h1 id="pair-name">PAIR</h1>
        <p id="pair-summary" class="muted"></p>
      </div>
    </section>

    <div id="owner-pair-tools" class="owner-tools hidden">
      <button id="edit-pair-btn" class="ghost">페어 기본정보 수정</button>
      <button id="delete-pair-btn" class="ghost danger">페어 삭제</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="profile">PROFILE</button>
      <button class="tab" data-tab="log">LOG</button>
      <button class="tab" data-tab="gallery">GALLERY</button>
    </div>

    <section id="profile" class="tab-panel active">
      <div class="panel-head">
        <h2>PROFILE</h2>
        <button id="edit-pair-profile-btn" class="owner-only hidden">프로필 편집</button>
      </div>

      <div id="pair-member-grid" class="pair-member-grid"></div>

      <article class="relationship-card">
        <p class="eyebrow">RELATIONSHIP</p>
        <h3>관계성</h3>
        <div id="relationship-text" class="post-body"></div>
      </article>
    </section>

    <section id="log" class="tab-panel">
      <div class="panel-head">
        <h2>LOG</h2>
        <button class="owner-only hidden" data-open-post-editor="log">+ 로그 게시물</button>
      </div>
      <div id="pair-log-feed" class="feed"></div>
    </section>

    <section id="gallery" class="tab-panel">
      <div class="panel-head">
        <h2>GALLERY</h2>
        <button class="owner-only hidden" data-open-post-editor="gallery">+ 갤러리 게시물</button>
      </div>
      <div id="pair-gallery-feed" class="feed"></div>
    </section>
  </main>

  <dialog id="pair-dialog" class="editor-dialog">
    <form method="dialog" class="editor-shell">
      <div class="editor-top">
        <h2>페어 기본정보</h2>
        <button value="cancel" class="ghost">닫기</button>
      </div>
      <label>페어 이름
        <input id="pair-edit-name" type="text">
      </label>
      <label>한 줄 설명
        <input id="pair-edit-summary" type="text">
      </label>
      <button id="save-pair-btn" type="button">저장</button>
      <p id="pair-edit-msg" class="status"></p>
    </form>
  </dialog>

  <dialog id="profile-dialog" class="editor-dialog wide-dialog">
    <form method="dialog" class="editor-shell">
      <div class="editor-top">
        <h2>PAIR PROFILE 편집</h2>
        <button value="cancel" class="ghost">닫기</button>
      </div>

      <p class="muted">기존 캐릭터 중 최대 4명까지 선택할 수 있습니다.</p>
      <div id="member-editor-list" class="member-editor-list"></div>

      <label>관계성 설명
        <textarea id="relationship-edit" rows="10" placeholder="이 캐릭터들의 관계성을 한 번에 서술하세요."></textarea>
      </label>

      <button id="save-profile-btn" type="button">프로필 저장</button>
      <p id="profile-edit-msg" class="status"></p>
    </form>
  </dialog>

  <dialog id="post-dialog" class="editor-dialog">
    <form method="dialog" class="editor-shell">
      <div class="editor-top">
        <h2 id="post-dialog-title">게시물 편집</h2>
        <button value="cancel" class="ghost">닫기</button>
      </div>

      <input id="post-kind" type="hidden">
      <input id="post-id" type="hidden">

      <label>제목
        <input id="post-title" type="text" placeholder="선택사항">
      </label>

      <label>내용
        <textarea id="post-body" rows="9" placeholder="텍스트 없이 사진만 올려도 됩니다."></textarea>
      </label>

      <div class="multi-image-box">
        <div class="subhead">
          <strong>이미지</strong>
          <span class="muted">여러 장 선택 가능</span>
        </div>
        <input id="post-images" type="file" accept="image/*" multiple>
        <div id="post-new-caption-list" class="image-edit-list"></div>
      </div>

      <div id="post-existing-wrap" class="multi-image-box hidden">
        <div class="subhead">
          <strong>현재 이미지</strong>
          <span class="muted">캡션 수정 / 개별 삭제 가능</span>
        </div>
        <div id="post-existing-list" class="image-edit-list"></div>
      </div>

      <div class="button-row">
        <button id="save-post-btn" type="button">저장</button>
        <button id="delete-post-btn" type="button" class="danger hidden">게시물 삭제</button>
      </div>
      <p id="post-edit-msg" class="status"></p>
    </form>
  </dialog>

  <footer>© elingne</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="pair-v4.js"></script>
</body>
</html>
