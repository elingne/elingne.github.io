<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>elingne archive</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="spa-body">
  <header class="site-header">
    <a class="logo" href="#/">elingne</a>
    <nav>
      <a data-nav="main" href="#/">MAIN</a>
      <a data-nav="character" href="#/characters">CHARACTER</a>
      <a data-nav="pair" href="#/pairs">PAIR</a>
      <a id="auth-link" data-nav="admin" class="admin-link" href="#/admin">ADMIN</a>
    </nav>
  </header>

  <aside id="bgm-panel" class="bgm-panel" aria-label="BGM 플레이리스트">
    <div class="bgm-heading">
      <div><p class="eyebrow">YOUTUBE BGM</p><h2>PLAYLIST</h2></div>
      <span id="bgm-state" class="bgm-state">준비 중</span>
    </div>
    <div id="youtube-player" class="youtube-player"></div>
    <div class="bgm-controls">
      <button id="bgm-toggle" type="button" class="bgm-control" aria-label="재생">▶</button>
      <label class="bgm-volume">VOL
        <input id="bgm-volume" type="range" min="0" max="100" value="45" aria-label="BGM 볼륨" />
      </label>
    </div>
    <p id="bgm-now" class="bgm-now">재생할 곡을 불러오는 중...</p>
    <div id="bgm-list" class="bgm-list"></div>
    <p id="bgm-note" class="bgm-note hidden">브라우저가 소리 자동재생을 막았어요. ▶ 버튼을 한 번 눌러주세요.</p>
  </aside>

  <div id="spa-view" aria-live="polite"></div>
  <footer>© elingne</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="bgm-player-v8.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="spa-v16.js"></script>
</body>
</html>
